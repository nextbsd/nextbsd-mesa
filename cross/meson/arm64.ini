# Meson cross file: NextBSD arm64.
#
# Used by build-mesa.sh as the SECOND of two --cross-file arguments. The first
# is generated per run (.build/cross/paths-arm64.ini) and defines the constants
# used here, which depend on the machine doing the build:
#   sysroot      the staged NextBSD base with nextbsd-xlibs' artifact in its
#                /usr/X11, and every earlier component of this repo
#   llvm_bindir  the toolchain image's pinned clang/lld 19.1.7 ($CROSS_BINDIR)
#   llvm_config  bin/llvm-config of nextbsd-toolchain's static LLVM 19.1.7 for
#                this arch (release llvm-static-19.1.7, $LLVM_STATIC)
# Meson lets a later machine file use constants from an earlier one.

[constants]
triple = 'aarch64-unknown-freebsd'
target_args = ['--target=' + triple, '--sysroot=' + sysroot]

[binaries]
c = [llvm_bindir / 'clang'] + target_args
cpp = [llvm_bindir / 'clang++'] + target_args
# -fuse-ld=lld at link time only; clang finds ld.lld beside itself.
c_ld = 'lld'
cpp_ld = 'lld'
ar = llvm_bindir / 'llvm-ar'
ranlib = llvm_bindir / 'llvm-ranlib'
nm = llvm_bindir / 'llvm-nm'
strip = llvm_bindir / 'llvm-strip'
objcopy = llvm_bindir / 'llvm-objcopy'
readelf = llvm_bindir / 'llvm-readelf'
# The ISC pkgconf from the image, never freedesktop's GPL pkg-config.
pkg-config = 'pkgconf'
cmake = 'cmake'
# A build-host program that answers for the NextBSD target (static, RTTI on,
# libc++). Mesa links the archives it names into libgallium (E23 D3).
llvm-config = llvm_config

[properties]
needs_exe_wrapper = true
# Meson exports sys_root as PKG_CONFIG_SYSROOT_DIR, so -I/-L from .pc files
# point into the sysroot. Only the sysroot's .pc directories are searched:
# NextBSD X in /usr/X11/lib/pkgconfig, then the base in /usr/libdata/pkgconfig.
# Nothing from the Linux build host can leak in.
sys_root = sysroot
pkg_config_libdir = [sysroot / 'usr/X11/lib/pkgconfig', sysroot / 'usr/libdata/pkgconfig']

[host_machine]
# 'freebsd', not 'nextbsd' (E23 D12): Mesa's and libglvnd's meson.build test
# host_machine.system() == 'freebsd' for DRM/KMS (and so GBM), libglvnd's
# x86_64 TLS dispatch stubs, and the BSD code paths, and those are the right
# ones here.
system = 'freebsd'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
